server:
  port: 8989

# 开发环境日志目录（相对路径，避免写系统 /logs）
app:
  log:
    base: ./logs

spring:
  jackson:
    ## 默认序列化时间格式
    date-format: yyyy-MM-dd HH:mm:ss
    ## 默认序列化时区
    time-zone: GMT+8
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cc_etl?zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&autoReconnect=true&allowMultiQueries=true
    username: root
    password: 123456
  # 邮件配置
  mail:
    host: smtp.qq.com
    port: 465
    username: your-email@example.com
    password: 123456
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    # 邮件发送者
    from: youlaitech@163.com

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      # 主键ID类型
      id-type: none
      # 逻辑删除全局属性名(驼峰和下划线都支持)
      logic-delete-field: isDeleted
      # 逻辑删除-删除值
      logic-delete-value: 1
      # 逻辑删除-未删除值
      logic-not-delete-value: 0
  configuration:
    # 驼峰下划线转换
    map-underscore-to-camel-case: true
    # 这个配置会将执行的sql打印出来，在开发或测试的时候可以用
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# xxl-job 定时任务配置
xxl:
  job:
    i18n: zh_CN
    accessToken: default_token
    triggerpool:
      fast:
        max: 200
      slow:
        max: 200
    logretentiondays: 30
    logpath: /Users/xiaozhao/Desktop/xz/logs #日志文件地址

# CC-Job 节点执行结果存储配置
cc-job:
  result:
    storage:
      file:
        # 文件存储基础路径（绝对路径），需要与executor-compose模块保持一致
        basePath: /Users/xiaozhao/Desktop/xz/cc-job-results
  # 告警 Webhook（任务失败时 POST JSON 到配置的 URL）
  alarm:
    webhook:
      enabled: false
      url: ''   # 例如 https://your-server.com/webhook，多个用逗号分隔
      method: POST
      connect-timeout-seconds: 10
      read-timeout-seconds: 15
      # headers: {}   # 可选，如 Authorization: Bearer xxx
      # body-template: ''  # 可选，自定义 body 模板，占位符 {jobId},{jobDesc},{logId} 等
    # 告警收敛：同一任务 N 分钟内只告警一次，0 表示关闭
    convergence-minutes: 10
    # 钉钉机器人告警（可选）
    dingtalk:
      enabled: false
      webhook-url: ''   # 钉钉群机器人 Webhook 地址
    # 企业微信机器人告警（可选）
    wecom:
      enabled: false
      webhook-url: ''   # 企微群机器人 Webhook 地址
    # 飞书机器人告警（可选）
    feishu:
      enabled: false
      webhook-url: ''   # 飞书群机器人 Webhook 地址
    # 告警规则：连续失败 N 次才告警、仅工作时间告警
    rules:
      consecutive-failures: 0   # 连续失败达到此次数才告警，0 关闭
      work-hours-start: ''      # 仅工作时间开始 如 09:00
      work-hours-end: ''        # 仅工作时间结束 如 18:00
      work-days: '1-5'          # 工作日 1-7 表示周一到周日，如 1-5 表示工作日
# 生命周期 Webhook：任务成功/失败时 POST JSON 到配置的 URL
  lifecycle:
    webhook:
      enabled: false
      url: []   # 例如 - https://your-server.com/webhook
      events: []  # 空表示全部，可选 success, fail
