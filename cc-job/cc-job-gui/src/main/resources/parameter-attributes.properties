# 参数属性配置文件
# 定义常用的参数属性，用于自动补全功能
# 多个属性用逗号分隔

# ============ 第一级属性（NodeResult 的直接属性）============

# 通用属性（所有节点类型都支持）
parameter.attributes.common=code,message,success,duration,timestamp,data

# SQL节点第一级属性
parameter.attributes.sql=data,count,affectedRows,columns,columnTypes,sqlType,executedSql,executionTime

# API节点第一级属性
parameter.attributes.api=response,request,responseTime

# Bean节点第一级属性
parameter.attributes.bean=value,methodName,className,returnType

# Glue节点第一级属性（所有Glue类型共用）
parameter.attributes.glue=output,error,exitCode,result,scriptType,logOutput,executionTime

# ============ 嵌套属性（链式调用的第二级及以下）============

# data 对象的属性/方法（当 data 是 List<Map> 时，如 SQL 节点）
parameter.attributes.data.list=get,range,size,first,last,isEmpty

# data 对象的属性/方法（当 data 是 Map 时）
parameter.attributes.data.map=keys,values,entries,get,containsKey,containsValue

# response 对象的属性（API 节点）
parameter.attributes.response=body,rawBody,headers,statusCode,contentType

# request 对象的属性（API 节点）
parameter.attributes.request=url,method,headers,body

# 向后兼容：默认属性列表（如果节点类型无法识别，使用此列表）
parameter.attributes=result,value,list,data,output,response,status,code,message,count,total,items,records

